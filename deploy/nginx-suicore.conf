# Nginx для suicore.space
# После правок: sudo nginx -t && sudo systemctl reload nginx
# SSL: certbot --nginx -d suicore.space (один раз)

server {
    listen 80;
    server_name suicore.space www.suicore.space;

    root /var/www/suicore.space/dist;
    index index.html;

    # API → Node на порту 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: все GET-запросы не к файлам — index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# После certbot появится server { listen 443 ssl; ... } с теми же location
